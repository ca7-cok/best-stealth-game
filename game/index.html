<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow Lantern — a stealth game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { width: min(100vw, 150vh); height: min(66.6667vw, 100vh); display: block; touch-action: none; background: #0a0e1d; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="640" aria-label="Shadow Lantern: sneak past the wardens, gather every lantern, and slip through the moon-gate unseen"></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
